<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; background: #f5f5f5; }
        form { background: white; width: 320px; margin: auto; padding: 25px; border-radius: 10px; box-shadow: 0 0 10px #ccc; }
        input { width: 90%; padding: 8px; margin-top: 5px; }
        button { padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; width: 95%; }
    </style>
</head>
<body>
    <h1>Login</h1>
    <form method="POST" action="/login">
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>
        <label>Password:</label><br>
        <input type="password" name="password" required><br><br>
        <button type="submit">Login</button>
    </form>
    <br>
    <a href="/">Home</a> | <a href="/register">New user? Register</a>
</body>
</html>
